name: Sync HomeMew Web production status docs

on:
  push:
    branches:
      - docs/converge-web-production-status
    paths:
      - .github/workflows/sync-web-production-status.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/converge-web-production-status
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Align accepted Web production state
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error(`${path}: expected stale text not found`);
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`${path}: stale text matched more than once`);
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          replaceOnce(
            'README.md',
            '生产已实现并验证 Access session exchange、explicit registration、one-time link challenge、same-origin Core/Identity proxy、外部系统管理编排与微信登录 provider pass-through。',
            '生产已实现并验证 Access session exchange、existing-user link challenge、same-origin Core/Identity proxy、外部系统管理编排与微信登录 provider pass-through；HomeMew Web 不暴露 LifeSpace Access registration。',
          );

          replaceOnce(
            'docs/architecture.md',
            'The final Web domain is `homemew.aisr.online`. That hostname currently also carries the production Mini Program login endpoint through `homemew-backend-production`. A later controlled production Web cutover must preserve `/api/v1/login/wechat`, preferably by routing that application-provider endpoint from the Web front-door Worker to `apps/backend/` through an explicit service binding. Until that is proven in staging, the Web Worker uses an isolated staging hostname/Access application and does not take production Mini Program traffic.',
            'The final Web domain is `homemew.aisr.online`. Since the accepted production cutover on 2026-08-24, that hostname is owned by `homemew-web-production`: browser Web traffic and the same-origin BFF remain behind Cloudflare Access, while the exact `POST /api/v1/login/wechat` provider route uses an Access bypass and the `HOMEMEW_BACKEND` Service Binding to `homemew-backend-production`. Normal Web deployments do not implicitly move Custom Domain ownership; domain transfer/rollback remains a separately confirmed release operation. `homemew-web-staging.aisr.online` remains the isolated staging hostname. See `docs/decisions/2026-08-24-web-production-cutover.md`.',
          );

          replaceOnce(
            'docs/web-plan.md',
            '- keep the mobile bottom bar to five high-frequency entries and move Wishes/Family/Settings into a dedicated More hub.',
            '- keep the mobile bottom bar to five high-frequency entries and move Wishes/Family/Settings into a dedicated More hub;\n- production front-door cutover completed on 2026-08-24: `homemew.aisr.online` is owned by `homemew-web-production`, with Cloudflare Access on Web traffic and exact Mini Program login pass-through via `HOMEMEW_BACKEND`.',
          );

          replaceOnce(
            'docs/web-plan.md',
            '- only after staging acceptance, add the richer Calendar renderer if it improves the product without changing LifeSpace semantics;\n- only after staging acceptance, design the production front-door cutover that preserves Mini Program backend routes.',
            '- only after household browser acceptance, add the richer Calendar renderer if it improves the product without changing LifeSpace semantics;\n- keep production front-door and Mini Program login compatibility as release invariants; normal Web deploys must not implicitly transfer the production Custom Domain.',
          );

          replaceOnce(
            'docs/web-plan.md',
            '## 11. Production routing constraint\n\nThe final Web domain remains `homemew.aisr.online`, but that hostname currently serves the production Mini Program login endpoint through `homemew-backend-production`.\n\nDo not transfer the production hostname to the Web Worker until the Web front-door preserves `/api/v1/login/wechat` through an explicit backend Service Binding/pass-through and the full Web path has passed staging verification.\n\nThe isolated first Web hostname remains `homemew-web-staging.aisr.online`.',
            '## 11. Production routing state\n\nThe final Web domain `homemew.aisr.online` is currently owned by `homemew-web-production`, following the accepted 2026-08-24 production cutover. Browser Web traffic stays behind Cloudflare Access; the exact Mini Program provider route `POST /api/v1/login/wechat` uses the Access bypass and `HOMEMEW_BACKEND` Service Binding to `homemew-backend-production`.\n\nNormal `homemew-web-production` deployments intentionally do not claim or move the Custom Domain. Any future ownership transfer or rollback remains a manual, confirmation-gated release operation and must re-verify Access protection, Mini Program login pass-through, LifeSpace production runtime and required Worker bindings.\n\nThe isolated staging hostname remains `homemew-web-staging.aisr.online`. See `docs/decisions/2026-08-24-web-production-cutover.md`.',
          );
          NODE

      - name: Commit documentation convergence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/architecture.md docs/web-plan.md
          git diff --cached --check
          git commit -m "docs: converge Web production front-door status"
          git push origin HEAD:docs/converge-web-production-status
