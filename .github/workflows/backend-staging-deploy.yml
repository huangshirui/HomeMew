name: Deploy HomeMew backend staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - .github/workflows/backend-staging-deploy.yml

permissions:
  contents: read

concurrency:
  group: homemew-backend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Validate backend syntax and contracts
        run: |
          node --check apps/backend/worker.mjs
          node --test apps/backend/*.test.mjs

      - name: Verify LifeSpace staging is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://auth-staging.aisr.online/health >/dev/null
          curl --fail --silent --show-error --retry 3 https://core-staging.aisr.online/health >/dev/null

      - name: Deploy staging Worker and Durable Object
        run: >-
          corepack pnpm dlx wrangler@4.49.1 deploy
          --config "$GITHUB_WORKSPACE/apps/backend/wrangler.jsonc"
          --env staging

      - name: Verify staging backend health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 12 --retry-delay 3 --retry-all-errors \
            https://homemew-staging.aisr.online/health)"
          echo "$HEALTH"
          printf '%s' "$HEALTH" > "$RUNNER_TEMP/homemew-staging-health.json"

      - name: Summarize staging deployment
        if: ${{ success() }}
        shell: bash
        run: |
          LOGIN_READY="$(node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/homemew-staging-health.json", "utf8"));
            process.stdout.write(data.loginReady === true ? "true" : "false");
          ')"
          ACTIVITY_READY="$(node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/homemew-staging-health.json", "utf8"));
            process.stdout.write(data.activityReady === true ? "true" : "false");
          ')"
          EXTERNAL_ACTIVITY_READY="$(node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/homemew-staging-health.json", "utf8"));
            process.stdout.write(data.externalActivityReady === true ? "true" : "false");
          ')"
          {
            echo "## HomeMew backend staging"
            echo
            echo "- Worker: https://homemew-staging.aisr.online"
            echo "- LifeSpace Identity: https://auth-staging.aisr.online"
            echo "- LifeSpace Core: https://core-staging.aisr.online"
            echo "- Identity mapping: SQLite-backed Durable Object"
            echo "- Member activity: SQLite-backed Durable Object"
            echo "- Wrangler: pinned standalone 4.49.1 (no legacy Core dependency)"
            echo "- Runtime secrets: Cloudflare Worker Secrets (not duplicated in GitHub Actions)"
            echo "- Login ready: ${LOGIN_READY}"
            echo "- Activity ready: ${ACTIVITY_READY}"
            echo "- External Activity API ready: ${EXTERNAL_ACTIVITY_READY}"
            echo "- Production traffic/configuration: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
