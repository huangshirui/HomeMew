name: Complete Search Contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/search-contract-trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update OpenAPI and documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          openapi = "apps/core/openapi.yaml"
          replace_once(openapi,
          """        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: '#/components/parameters/Limit'
""",
          """        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
""")

          replace_once(openapi,
          """        - name: sort
          in: query
          schema:
            type: string
            enum: [due_asc, due_desc, created_desc, updated_desc]
            default: due_asc
        - $ref: '#/components/parameters/Limit'
""",
          """        - name: sort
          in: query
          schema:
            type: string
            enum: [due_asc, due_desc, created_desc, updated_desc]
            default: due_asc
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
""")

          replace_once(openapi,
          """    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
""",
          """    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description: |
        Substring search after trimming leading and trailing whitespace. Blank
        or overlong values return INVALID_REQUEST. Event lists search summary,
        description, and location within the required date window. Task lists
        search name and description. The value is part of the opaque cursor
        filter; changing it requires starting again without a cursor.
  responses:
""")

          check = "apps/core/scripts/check-openapi.mjs"
          replace_once(check,
          """if(eventParameter(\"start\")||eventParameter(\"end\"))throw new Error(\"Legacy event-list range parameters are forbidden\");

const schemas=document.components.schemas;
""",
          """if(eventParameter(\"start\")||eventParameter(\"end\"))throw new Error(\"Legacy event-list range parameters are forbidden\");

const searchQuery=document.components.parameters.SearchQuery;
if(searchQuery?.name!==\"q\"||searchQuery?.in!==\"query\"||searchQuery?.required!==false||searchQuery?.schema?.minLength!==1||searchQuery?.schema?.maxLength!==100)throw new Error(\"SearchQuery must define optional q with a 1-100 character contract\");
for(const path of [\"/api/v1/families/{familyId}/events\",\"/api/v1/families/{familyId}/tasks\"]){
  if(!document.paths[path].get.parameters.some((parameter)=>parameter.$ref===\"#/components/parameters/SearchQuery\"))throw new Error(`${path} must reference SearchQuery`);
}

const schemas=document.components.schemas;
""")

          readme = "apps/core/README.md"
          replace_once(readme,
          """全天日程使用 `startDate/endDateExclusive`，两类字段不能混用。列表必须传 `startDate/endDateExclusive`，可选 `timezone` 指定查看日历的时区，单次最大 366 天。

创建示例：
""",
          """全天日程使用 `startDate/endDateExclusive`，两类字段不能混用。列表必须传 `startDate/endDateExclusive`，可选 `timezone` 指定查看日历的时区，单次最大 366 天。

列表可选传 `q`，在当前日期窗口内对子串搜索 `summary`、`description` 和 `location`。Core 会去除首尾空格，结果必须为 1 至 100 个字符；空白或超长搜索词返回 `INVALID_REQUEST`。`q` 与其他筛选条件一起绑定到分页 cursor，改变搜索词后必须丢弃旧 cursor，从第一页重新查询。

创建示例：
""")

          replace_once(readme,
          """`dueDate` 只接受 `YYYY-MM-DD` 或 `null`。列表默认只返回 `pending`，支持多个 `status`、`assigneeId=me`、`dueDateFrom`、`dueDateTo`、`includeNoDue`、四种 `sort`、`limit` 和不透明 `cursor`；按截止日期排序时无截止日期始终在最后。

所有日程和待办接口都要求当前 JWT 用户是目标家庭的 active 成员。
""",
          """`dueDate` 只接受 `YYYY-MM-DD` 或 `null`。列表默认只返回 `pending`，支持多个 `status`、`assigneeId=me`、`dueDateFrom`、`dueDateTo`、`includeNoDue`、四种 `sort`、`limit` 和不透明 `cursor`；按截止日期排序时无截止日期始终在最后。

待办列表可选传 `q`，对子串搜索 `name` 和 `description`，并可与状态、负责人、截止日期和排序条件组合。搜索词同样会去除首尾空格并限制为 1 至 100 个字符；搜索条件变化后不能复用旧 cursor。

所有日程和待办接口都要求当前 JWT 用户是目标家庭的 active 成员。
""")
          PY

      - name: Validate contract
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @homemew/core contract

      - name: Commit to main and remove workflow
        shell: bash
        run: |
          rm .github/workflows/complete-search-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs apps/core/README.md .github/workflows/complete-search-contract.yml
          git commit -m "docs: complete event and task search contract"
          git push origin main
