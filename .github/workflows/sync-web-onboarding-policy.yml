name: Sync HomeMew Web onboarding policy docs

on:
  push:
    branches:
      - fix/web-existing-user-onboarding-policy
    paths:
      - .github/workflows/sync-web-onboarding-policy.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/web-existing-user-onboarding-policy
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Align accepted onboarding policy
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error(`${path}: expected stale text not found`);
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`${path}: stale text matched more than once`);
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          replaceOnce(
            'docs/architecture.md',
            `Unknown Access principals are explicit flows, never email merges:\n\n\`\`\`text\nunlinked Access principal\n  ├─ link existing LifeSpace account\n  │    -> Web creates Identity one-time link challenge\n  │    -> already-authenticated Mini Program confirms challenge\n  │    -> Identity derives usr_* from Mini Program bearer\n  │\n  └─ create new LifeSpace account\n       -> explicit Identity Access registration\n       -> create usr_* + bind verified (iss, sub) atomically\n\`\`\`\n\nThe target user ID for account linking is never supplied by Web. Identity owns the Access-principal -> \`usr_*\` relationship.`,
            `For HomeMew, an unknown Access principal has exactly one onboarding path: link the already-existing HomeMew/LifeSpace account through the Mini Program. HomeMew Web does not expose LifeSpace Access registration and does not create a new LifeSpace user. LifeSpace Identity may retain explicit Access registration as a platform capability for other applications.\n\n\`\`\`text\nunlinked Access principal\n  -> Web creates Identity one-time link challenge\n  -> already-authenticated Mini Program confirms challenge\n  -> Identity derives usr_* from Mini Program bearer\n  -> Identity binds the verified Access principal to that existing usr_*\n  -> Web retries /api/session\n\`\`\`\n\nThe target user ID for account linking is never supplied by Web. Identity owns the Access-principal -> \`usr_*\` relationship. This HomeMew product policy is fixed by \`docs/decisions/2026-08-25-web-existing-user-link-only.md\`.`,
          );

          replaceOnce(
            'docs/web-plan.md',
            'Unknown Access principals use explicit link-existing or create-new flows. Email equality is never sufficient to merge identities and Web never submits a target LifeSpace user ID for linking.',
            'An unknown Access principal only links an existing HomeMew/LifeSpace user through the Mini Program confirmation flow. HomeMew Web does not expose LifeSpace Access registration or create a new user. Email equality is never sufficient to merge identities and Web never submits a target LifeSpace user ID for linking.',
          );

          replaceOnce(
            'docs/web-plan.md',
            '- LifeSpace Identity Access principal exchange/link/registration;\n- HomeMew same-origin Worker BFF;\n- signed host-only application session;\n- explicit account linking/registration UI;',
            '- LifeSpace Identity Access principal exchange and proof-backed link challenge;\n- HomeMew same-origin Worker BFF;\n- signed host-only application session;\n- existing-account linking UI; HomeMew Web intentionally does not expose Access registration;',
          );

          replaceOnce(
            'docs/web-plan.md',
            '- fix first-family onboarding so a fresh Web user can create/join a family;',
            '- fix first-family onboarding so a linked existing HomeMew user with no accessible family can create/join a family;',
          );
          NODE

      - name: Commit documentation alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture.md docs/web-plan.md
          git diff --cached --check
          git commit -m "docs: align Web onboarding with existing-user-only policy"
          git push origin HEAD:fix/web-existing-user-onboarding-policy
