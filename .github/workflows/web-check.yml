name: Web check

on:
  pull_request:
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-check.yml
      - .github/workflows/web-staging-deploy.yml

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck and build HomeMew Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Test Web BFF
        run: corepack pnpm test:web

      - name: Typecheck Web
        run: corepack pnpm typecheck:web

      - name: Build Web
        run: corepack pnpm build:web
