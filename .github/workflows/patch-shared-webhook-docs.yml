name: Patch shared webhook docs

on:
  push:
    branches: [feat/shared-webhook-endpoint]
    paths:
      - apps/web/scripts/patch-shared-webhook-docs.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-webhook-endpoint
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node apps/web/scripts/patch-shared-webhook-docs.mjs
      - name: Commit docs
        run: |
          if git diff --quiet; then
            echo "No doc changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/product-rules.md apps/web/README.md
          git commit -m "docs(web): align shared webhook endpoint UX"
          git push origin HEAD:feat/shared-webhook-endpoint
