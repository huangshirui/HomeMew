name: Deploy Core

on:
  push:
    branches:
      - main
    paths:
      - apps/core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/core-deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy-core
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check Core
        run: |
          corepack pnpm --filter @homemew/core contract
          corepack pnpm --filter @homemew/core test
          corepack pnpm --filter @homemew/core typecheck
          corepack pnpm --filter @homemew/core build

      - name: Ensure creation draft queue
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set +e
          output=$(corepack pnpm --filter @homemew/core exec wrangler queues create homemew-creation-drafts 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -qi "already exists"; then
            exit $status
          fi

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: corepack pnpm --filter @homemew/core db:migrate:remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: corepack pnpm --filter @homemew/core run deploy

      - name: Report missing deployment secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Core checks passed; deployment skipped because Cloudflare secrets are not configured."
