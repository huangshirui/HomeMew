name: Prepare HomeMew Web production

on:
  push:
    branches:
      - main
    paths:
      - apps/web/front-door.mjs
      - apps/web/front-door.test.mjs
      - apps/web/wrangler.production.jsonc
      - apps/web/scripts/prepare-production-access.mjs
      - .github/workflows/web-production-prepare.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: homemew-web-production-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare traffic-dark HomeMew Web production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOMEMEW_WEB_PRODUCTION_CONFIRMATION: PREPARE_HOMEMEW_WEB_PRODUCTION

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report preparation started
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "starting" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          node --input-type=module <<'NODE'
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
            body: JSON.stringify({ state: 'pending', target_url: runUrl, description: 'HomeMew Web production preparation started', context: 'homemew-web-production/prepare' }),
          });
          if (!response.ok) throw new Error(`Could not publish pending status: ${response.status}`);
          NODE

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          echo "install" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          corepack pnpm install --frozen-lockfile

      - name: Validate production authority and config
        shell: bash
        run: |
          echo "validate" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('apps/web/wrangler.production.jsonc', 'utf8'));
          if (raw.name !== 'homemew-web-production') throw new Error('production Worker name is invalid');
          if (raw.workers_dev !== false) throw new Error('production workers_dev must remain false');
          if (Array.isArray(raw.routes) && raw.routes.length) throw new Error('production prepare must remain traffic-dark');
          if (raw.vars?.ENVIRONMENT !== 'production') throw new Error('production environment marker is invalid');
          if (raw.vars?.LIFESPACE_IDENTITY_URL !== 'https://auth.aisr.online') throw new Error('production Identity URL is invalid');
          if (raw.vars?.LIFESPACE_CORE_URL !== 'https://core.aisr.online') throw new Error('production Core URL is invalid');
          const backend = raw.services?.find((entry) => entry.binding === 'HOMEMEW_BACKEND');
          if (backend?.service !== 'homemew-backend-production') throw new Error('production provider backend service binding is missing');
          NODE

      - name: Validate HomeMew Web
        run: |
          echo "check" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          corepack pnpm test:web
          corepack pnpm typecheck:web
          corepack pnpm build:web

      - name: Deploy traffic-dark production Worker
        run: |
          echo "deploy-dark" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          corepack pnpm --dir apps/web exec wrangler deploy --config "$GITHUB_WORKSPACE/apps/web/wrangler.production.jsonc"

      - name: Prepare production Access and Mini Program bypass
        run: |
          echo "access" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          node apps/web/scripts/prepare-production-access.mjs

      - name: Verify Mini Program login stays public on current production backend
        shell: bash
        run: |
          echo "verify-login-bypass" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' --connect-timeout 5 --max-time 15 \
            -X POST -H 'content-type: application/json' --data '{}' https://homemew.aisr.online/api/v1/login/wechat)"
          test "$code" = "400" || { echo "Expected public login validation HTTP 400, got $code" >&2; cat "$tmp" >&2; exit 1; }
          TMP_PATH="$tmp" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.TMP_PATH, 'utf8'));
          if (payload?.error?.code !== 'INVALID_REQUEST') throw new Error('Mini Program login did not reach the HomeMew backend');
          NODE

      - name: Verify Web root is protected by Access
        shell: bash
        run: |
          echo "verify-access" > "$RUNNER_TEMP/homemew-web-production-prepare-stage"
          set -euo pipefail
          code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 https://homemew.aisr.online/)"
          case "$code" in
            301|302|303|307|308|401|403) echo "Production Web root is protected by Access (HTTP $code)" ;;
            *) echo "Expected Cloudflare Access protection on production root, got HTTP $code" >&2; exit 1 ;;
          esac

      - name: Report preparation result
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/homemew-web-production-prepare-stage`;
          const stage = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : 'unknown';
          const ok = process.env.JOB_STATUS === 'success';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST', headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
            body: JSON.stringify({ state: ok ? 'success' : 'failure', target_url: runUrl, description: ok ? 'HomeMew Web production preparation succeeded' : `HomeMew Web production prepare failed at ${stage}`, context: 'homemew-web-production/prepare' }),
          });
          if (!response.ok) throw new Error(`Could not publish final status: ${response.status}`);
          NODE

      - name: Summarize production preparation
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## HomeMew Web production preparation

          - Worker \`homemew-web-production\`: deployed traffic-dark
          - Provider backend Service Binding: \`homemew-backend-production\`
          - Access root application: configured for \`homemew.aisr.online\`
          - Access AUD: \`${HOMEMEW_WEB_PRODUCTION_ACCESS_AUD}\`
          - Mini Program login path: public via exact Access bypass and still served by the existing production backend
          - Custom Domain ownership: unchanged; still on \`homemew-backend-production\`
          - Next gate: provision production LifeSpace Web + integrations application credentials into \`homemew-web-production\`
          EOF
