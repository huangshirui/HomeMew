name: Cut over HomeMew Web production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CUTOVER_HOMEMEW_WEB_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: homemew-web-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Cut over HomeMew Web production front door
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOMEMEW_WEB_PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Validate explicit production cutover intent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main" || { echo "production cutover must run from main" >&2; exit 1; }
          test "${HOMEMEW_WEB_PRODUCTION_CONFIRMATION:-}" = "CUTOVER_HOMEMEW_WEB_PRODUCTION" || {
            echo "confirmation must be CUTOVER_HOMEMEW_WEB_PRODUCTION" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Report cutover started
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "starting" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          node --input-type=module <<'NODE'
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
            body: JSON.stringify({ state: 'pending', target_url: runUrl, description: 'HomeMew Web production cutover started', context: 'homemew-web-production/cutover' }),
          });
          if (!response.ok) throw new Error(`Could not publish pending status: ${response.status}`);
          NODE

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          echo "install" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          corepack pnpm install --frozen-lockfile

      - name: Validate production Web config remains route-free
        shell: bash
        run: |
          echo "validate-config" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('apps/web/wrangler.production.jsonc', 'utf8'));
          if (raw.name !== 'homemew-web-production') throw new Error('production Worker name is invalid');
          if (raw.workers_dev !== false) throw new Error('production workers_dev must remain false');
          if (Array.isArray(raw.routes) && raw.routes.length) throw new Error('production Custom Domain must remain managed by the manual cutover workflow');
          if (raw.vars?.ENVIRONMENT !== 'production') throw new Error('production environment marker is invalid');
          if (raw.vars?.LIFESPACE_IDENTITY_URL !== 'https://auth.aisr.online') throw new Error('production Identity URL is invalid');
          if (raw.vars?.LIFESPACE_CORE_URL !== 'https://core.aisr.online') throw new Error('production Core URL is invalid');
          const backend = raw.services?.find((entry) => entry.binding === 'HOMEMEW_BACKEND');
          if (backend?.service !== 'homemew-backend-production') throw new Error('production provider backend service binding is missing');
          NODE

      - name: Validate HomeMew Web release
        run: |
          echo "check" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          corepack pnpm test:web
          corepack pnpm typecheck:web
          corepack pnpm build:web

      - name: Deploy current main to production Worker before routing
        run: |
          echo "deploy" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          corepack pnpm --dir apps/web exec wrangler deploy --config "$GITHUB_WORKSPACE/apps/web/wrangler.production.jsonc"

      - name: Transfer production Custom Domain with automatic rollback
        run: |
          echo "cutover" > "$RUNNER_TEMP/homemew-web-production-cutover-stage"
          node apps/web/scripts/cutover-production-domain.mjs

      - name: Report cutover result
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/homemew-web-production-cutover-stage`;
          const stage = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : 'unknown';
          const ok = process.env.JOB_STATUS === 'success';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
            body: JSON.stringify({ state: ok ? 'success' : 'failure', target_url: runUrl, description: ok ? 'HomeMew Web production cutover succeeded' : `HomeMew Web production cutover failed at ${stage}`, context: 'homemew-web-production/cutover' }),
          });
          if (!response.ok) throw new Error(`Could not publish final status: ${response.status}`);
          NODE

      - name: Summarize production cutover
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew Web production cutover

          - `homemew.aisr.online` -> `homemew-web-production`
          - Cloudflare Access root protection: passed
          - Mini Program `POST /api/v1/login/wechat`: passed through `HOMEMEW_BACKEND`
          - LifeSpace production runtime gate: passed
          - Required Web + integrations secret bindings: passed
          - Automatic rollback: armed for failures caused by this run's domain transfer
          EOF
