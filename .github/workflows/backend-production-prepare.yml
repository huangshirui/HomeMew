name: Prepare HomeMew backend production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREPARE_HOMEMEW_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homemew-backend-production-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate production preparation intent
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "PREPARE_HOMEMEW_PRODUCTION" || {
            echo "confirmation must be PREPARE_HOMEMEW_PRODUCTION" >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Validate production backend configuration is traffic-dark
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('apps/backend/wrangler.jsonc', 'utf8');
          const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
          const prod = config.env?.production;
          if (!prod) throw new Error('production environment is missing');
          if (prod.workers_dev !== false) throw new Error('production workers_dev must remain false');
          if (Array.isArray(prod.routes) && prod.routes.length) throw new Error('production prepare must not bind routes');
          if (prod.vars?.ENVIRONMENT !== 'production') throw new Error('production ENVIRONMENT is invalid');
          if (prod.vars?.LIFESPACE_IDENTITY_URL !== 'https://auth.aisr.online') throw new Error('production Identity URL is invalid');
          if (prod.vars?.LIFESPACE_CORE_URL !== 'https://core.aisr.online') throw new Error('production Core URL is invalid');
          console.log('Production backend config is traffic-dark and points only to LifeSpace production.');
          NODE

      - name: Validate backend syntax
        run: node --check apps/backend/worker.mjs

      - name: Verify LifeSpace production is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://auth.aisr.online/health >/dev/null
          curl --fail --silent --show-error --retry 3 https://core.aisr.online/health >/dev/null

      - name: Deploy production Worker and Durable Object without traffic route
        run: >-
          corepack pnpm --dir apps/core exec wrangler deploy
          --config "$GITHUB_WORKSPACE/apps/backend/wrangler.jsonc"
          --env production

      - name: Summarize production preparation
        shell: bash
        run: |
          {
            echo "## HomeMew backend production preparation"
            echo
            echo "- Worker: \`homemew-backend-production\`"
            echo "- Durable Object: production \`WECHAT_IDENTITIES\` namespace initialized"
            echo "- LifeSpace Identity: https://auth.aisr.online"
            echo "- LifeSpace Core: https://core.aisr.online"
            echo "- Custom domain / production traffic route: **not bound**"
            echo "- Runtime business secrets: **not created or copied by GitHub Actions**"
            echo "- Existing \`homemew.aisr.online\` traffic: **untouched**"
          } >> "$GITHUB_STEP_SUMMARY"
