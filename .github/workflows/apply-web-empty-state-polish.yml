name: Apply HomeMew Web empty-state polish

on:
  push:
    branches:
      - feat/web-empty-state-polish
    paths:
      - .github/workflows/apply-web-empty-state-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/web-empty-state-polish
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply page empty states
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error(`${path}: expected text not found`);
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error(`${path}: text matched more than once`);
            fs.writeFileSync(path, source.replace(oldText, newText));
          }

          for (const path of [
            'apps/web/src/pages/tasks-page.tsx',
            'apps/web/src/pages/days-page.tsx',
            'apps/web/src/pages/wishes-page.tsx',
          ]) {
            replaceOnce(
              path,
              "import { Card } from '../components/ui/card';",
              "import { Card } from '../components/ui/card';\nimport { EmptyState } from '../components/ui/empty-state';",
            );
          }

          replaceOnce(
            'apps/web/src/pages/tasks-page.tsx',
            `          {!loading && !tasks.length ? (\n            <Card className="grid min-h-52 place-items-center p-8 text-center">\n              <div>\n                <div className="mx-auto grid size-12 place-items-center rounded-2xl bg-stone-100 text-stone-400"><CheckSquare2 className="size-5" /></div>\n                <p className="mt-4 font-medium text-stone-700">{query ? '没有找到匹配的待办' : tab === 'pending' ? '暂时没有未完成待办' : '暂时没有已完成待办'}</p>\n              </div>\n            </Card>\n          ) : null}`,
            `          {!loading && !tasks.length ? (\n            <EmptyState\n              icon={<CheckSquare2 className="size-5" />}\n              title={query ? '没有找到匹配的待办' : tab === 'pending' ? '暂时没有未完成待办' : '暂时没有已完成待办'}\n              description={query ? '换个关键词试试，或者清除当前搜索。' : tab === 'pending' ? '现在没有需要处理的家庭待办。' : '完成过的待办会出现在这里。'}\n              actionLabel={query ? '清除搜索' : tab === 'pending' && canWrite ? '新建待办' : undefined}\n              onAction={query ? () => { setQueryInput(''); setQuery(''); } : tab === 'pending' && canWrite ? openCreate : undefined}\n            />\n          ) : null}`,
          );

          replaceOnce(
            'apps/web/src/pages/days-page.tsx',
            `          {!loading && !records.length ? <Card className="grid min-h-52 place-items-center p-8 text-sm text-stone-500">{status === 'active' ? '还没有日子记录。' : '没有已归档记录。'}</Card> : null}`,
            `          {!loading && !records.length ? (\n            <EmptyState\n              icon={<CalendarClock className="size-5" />}\n              title={status === 'active' ? '还没有日子记录' : '没有已归档记录'}\n              description={status === 'active' ? '记录已经多久、还有多久，或者需要按周期关注的家庭事项。' : '归档的日子会保留在这里，方便以后恢复。'}\n              actionLabel={status === 'active' && canWrite ? '新建日子' : undefined}\n              onAction={status === 'active' && canWrite ? openCreate : undefined}\n            />\n          ) : null}`,
          );

          replaceOnce(
            'apps/web/src/pages/wishes-page.tsx',
            `          {!loading && !wishes.length ? <Card className="grid min-h-52 place-items-center p-8 text-sm text-stone-500">{tab === 'active' ? '还没有愿望，写下第一个吧。' : tab === 'fulfilled' ? '还没有已实现的愿望。' : '没有已归档愿望。'}</Card> : null}`,
            `          {!loading && !wishes.length ? (\n            <EmptyState\n              icon={<Gift className="size-5" />}\n              title={tab === 'active' ? '还没有愿望' : tab === 'fulfilled' ? '还没有已实现的愿望' : '没有已归档愿望'}\n              description={tab === 'active' ? '把想做、想要或想一起实现的小愿望先放进来。' : tab === 'fulfilled' ? '实现过的愿望会留在这里。' : '归档后的愿望会保留在这里。'}\n              actionLabel={tab === 'active' && canWrite ? '写下第一个愿望' : undefined}\n              onAction={tab === 'active' && canWrite ? openCreate : undefined}\n            />\n          ) : null}`,
          );
          NODE
      - name: Commit page polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/pages/tasks-page.tsx apps/web/src/pages/days-page.tsx apps/web/src/pages/wishes-page.tsx
          git diff --cached --check
          git commit -m "feat(web): make household empty states actionable"
          git push origin HEAD:feat/web-empty-state-polish
