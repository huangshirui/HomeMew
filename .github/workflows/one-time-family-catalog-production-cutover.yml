name: One-time HomeMew Family Catalog production cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type IMPORT_PRODUCTION_FAMILY_CATALOG to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homemew-family-catalog-production-cutover
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate one-time production gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || { echo "Cutover must run from main" >&2; exit 1; }
          test "${{ inputs.confirmation }}" = "IMPORT_PRODUCTION_FAMILY_CATALOG" || { echo "Confirmation mismatch" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

          curl --fail --silent --show-error https://core.aisr.online/api/v1/status > "$RUNNER_TEMP/lifespace-core-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/lifespace-core-status.json', 'utf8'));
          const data = payload?.data ?? payload;
          if (data?.status !== 'ok' || data?.service !== 'core' || data?.environment !== 'production') {
            throw new Error('LifeSpace Core production status is not healthy');
          }
          if (data.contractVersion !== '0.37.0' || Number(data.schemaVersion) !== 43) {
            throw new Error(`Expected migration source Core 0.37.0/schema43, got ${String(data.contractVersion)}/schema${String(data.schemaVersion)}`);
          }
          console.log('Confirmed LifeSpace migration source: Core 0.37.0 / schema 43');
          NODE

      - name: Import and exactly reconcile production Family Catalog
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/homemew-family-catalog-cutover"
          mkdir -p "$TMP"

          cat > "$TMP/worker.mjs" <<'WORKER'
          const expectedFamilySpaceIds = Object.freeze([
            'spc_6499923e45ac4ed2b1801e1df572207e',
            'spc_74f183a285164300b021a4074a1dc063',
            'spc_e05a68eece4149479b828ac7103cd131',
          ]);

          const json = (value, status = 200) => new Response(JSON.stringify(value, null, 2), {
            status,
            headers: { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' },
          });

          async function backend(env, path, method = 'GET', body) {
            const response = await env.HOMEMEW_BACKEND.fetch(new Request(
              `https://homemew-backend.internal${path}`,
              {
                method,
                headers: {
                  accept: 'application/json',
                  ...(body ? { 'content-type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              },
            ));
            const payload = await response.json().catch(() => null);
            if (!response.ok) {
              throw new Error(`${method} ${path} failed with HTTP ${response.status}: ${JSON.stringify(payload)}`);
            }
            return payload;
          }

          function sorted(values) {
            return [...values].sort((a, b) => a.localeCompare(b));
          }

          function sameIds(left, right) {
            const a = sorted(left);
            const b = sorted(right);
            return a.length === b.length && a.every((value, index) => value === b[index]);
          }

          export default {
            async fetch(request, env) {
              try {
                const url = new URL(request.url);
                if (request.method === 'GET' && url.pathname === '/health') {
                  return json({ ok: true });
                }
                if (request.method !== 'POST' || url.pathname !== '/run') {
                  return json({ error: 'not found' }, 404);
                }

                const imported = await backend(
                  env,
                  '/internal/v1/family-catalog/import',
                  'POST',
                  { spaceIds: expectedFamilySpaceIds },
                );
                const reconciled = await backend(
                  env,
                  '/internal/v1/family-catalog/reconcile',
                  'POST',
                  { spaceIds: expectedFamilySpaceIds },
                );
                const status = await backend(env, '/internal/v1/family-catalog/status');

                const actual = reconciled?.data?.familySpaceIds;
                if (!Array.isArray(actual) || !sameIds(expectedFamilySpaceIds, actual)) {
                  return json({
                    ok: false,
                    error: 'FAMILY_CATALOG_RECONCILE_MISMATCH',
                    expectedFamilySpaceIds,
                    actualFamilySpaceIds: actual ?? null,
                    imported,
                    status,
                  }, 409);
                }

                return json({
                  ok: true,
                  evidenceAt: new Date().toISOString(),
                  expectedFamilySpaceIds,
                  reconciledFamilySpaceIds: sorted(actual),
                  imported,
                  status,
                });
              } catch (error) {
                return json({
                  ok: false,
                  error: error instanceof Error ? error.message : String(error),
                }, 500);
              }
            },
          };
          WORKER

          cat > "$TMP/wrangler.jsonc" <<'WRANGLER'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "homemew-family-catalog-cutover-local",
            "main": "worker.mjs",
            "compatibility_date": "2026-09-24",
            "workers_dev": false,
            "services": [
              {
                "binding": "HOMEMEW_BACKEND",
                "service": "homemew-backend-production",
                "remote": true
              }
            ]
          }
          WRANGLER

          npx --yes wrangler@4.105.0 dev --config "$TMP/wrangler.jsonc" --port 8799 > "$RUNNER_TEMP/family-catalog-wrangler.log" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8799/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Temporary cutover Worker did not become ready" >&2
            cat "$RUNNER_TEMP/family-catalog-wrangler.log" >&2 || true
            exit 1
          fi

          HTTP_STATUS="$(curl --silent --show-error             -o "$RUNNER_TEMP/family-catalog-production-evidence.json"             -w '%{http_code}'             -X POST http://127.0.0.1:8799/run)"

          cat "$RUNNER_TEMP/family-catalog-production-evidence.json"
          test "$HTTP_STATUS" = "200" || {
            echo "Family Catalog cutover returned HTTP $HTTP_STATUS" >&2
            cat "$RUNNER_TEMP/family-catalog-wrangler.log" >&2 || true
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/family-catalog-production-evidence.json', 'utf8'));
          const expected = [
            'spc_6499923e45ac4ed2b1801e1df572207e',
            'spc_74f183a285164300b021a4074a1dc063',
            'spc_e05a68eece4149479b828ac7103cd131',
          ].sort();
          const actual = [...(evidence.reconciledFamilySpaceIds ?? [])].sort();
          if (evidence.ok !== true || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Production Family Catalog evidence is not an exact 3-ID match');
          }
          console.log('Production Family Catalog exact reconcile passed for 3 Space IDs.');
          NODE

      - name: Upload production migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: family-catalog-production-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/family-catalog-production-evidence.json
            ${{ runner.temp }}/lifespace-core-status.json
            ${{ runner.temp }}/family-catalog-wrangler.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize successful cutover
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## HomeMew production Family Catalog cutover"
            echo
            echo "- LifeSpace migration source verified: Core 0.37.0 / schema 43"
            echo "- Imported family Spaces: 3"
            echo "- Exact reconcile: PASS"
            echo "- Evidence artifact: family-catalog-production-evidence-${{ github.run_id }}"
            echo "- Next: enter a short maintenance window, deploy current LifeSpace production to Core 0.39/schema46, then deploy the no-kind HomeMew Web/BFF"
          } >> "$GITHUB_STEP_SUMMARY"
