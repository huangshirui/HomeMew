name: Deploy HomeMew Web Phase 4 staging candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact SHA of phase4/event-temporal-range-prep-2026-09-17 to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_HOMEMEW_WEB_PHASE4_STAGING to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homemew-web-phase4-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout fixed Phase 4 candidate branch
        uses: actions/checkout@v6
        with:
          ref: phase4/event-temporal-range-prep-2026-09-17

      - name: Pin exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "candidate branch SHA=$ACTUAL_SHA"
          echo "requested SHA=${{ inputs.candidate_sha }}"
          test "$ACTUAL_SHA" = "${{ inputs.candidate_sha }}" || {
            echo "Phase 4 candidate moved or the requested SHA is wrong; refusing deployment" >&2
            exit 1
          }
          test "${{ inputs.confirmation }}" = "DEPLOY_HOMEMEW_WEB_PHASE4_STAGING" || {
            echo "Phase 4 staging confirmation mismatch" >&2
            exit 1
          }

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Validate temporary staging config
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('apps/web/wrangler.phase4-staging.jsonc', 'utf8'));
          if (config.name !== 'homemew-web-staging') throw new Error('Unexpected Phase 4 staging Worker name');
          if (config.workers_dev !== false) throw new Error('Phase 4 staging workers_dev must remain false');
          if (config.vars?.ENVIRONMENT !== 'staging') throw new Error('Phase 4 staging ENVIRONMENT mismatch');
          if (config.vars?.LIFESPACE_IDENTITY_URL !== 'https://auth-staging.aisr.online') throw new Error('Unexpected staging Identity URL');
          if (config.vars?.LIFESPACE_CORE_URL !== 'https://core-staging.aisr.online') throw new Error('Unexpected staging Core URL');
          if (config.vars?.LIFESPACE_EVENT_CONTRACT !== 'temporal_range') throw new Error('Phase 4 staging must use temporal_range Event contract');
          const services = Object.fromEntries((config.services ?? []).map(entry => [entry.binding, entry.service]));
          if (services.HOMEMEW_BACKEND !== 'homemew-backend-staging') throw new Error('Unexpected HOMEMEW_BACKEND binding');
          if (services.LIFESPACE_CORE !== 'lifespace-core-staging') throw new Error('Unexpected LIFESPACE_CORE binding');
          if (services.LIFESPACE_IDENTITY !== 'lifespace-identity-staging') throw new Error('Unexpected LIFESPACE_IDENTITY binding');
          if (Object.values(services).some(value => String(value).endsWith('-production'))) throw new Error('Production service binding is forbidden');
          NODE

      - name: Verify LifeSpace staging baseline
        run: >-
          node apps/web/lifespace-release-baseline.mjs
          staging
          https://auth-staging.aisr.online
          https://core-staging.aisr.online

      - name: Test, typecheck and build Web
        run: |
          corepack pnpm test:web
          corepack pnpm typecheck:web
          corepack pnpm build:web

      - name: Deploy temporary Phase 4 Web staging
        run: >-
          corepack pnpm --dir apps/web exec wrangler deploy
          --config "$GITHUB_WORKSPACE/apps/web/wrangler.phase4-staging.jsonc"

      - name: Verify required Worker secrets still exist
        run: |
          node --input-type=module <<'NODE'
          const workerName = 'homemew-web-staging';
          const required = [
            'LIFESPACE_APPLICATION_CREDENTIAL',
            'WEB_SESSION_SECRET',
            'LIFESPACE_INTEGRATIONS_APPLICATION_CREDENTIAL',
          ];
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`,
            { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, accept: 'application/json' } },
          );
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
            throw new Error(`Could not inspect ${workerName} Worker secret bindings after deployment (HTTP ${response.status})`);
          }
          const names = new Set(payload.result.map(entry => entry?.name).filter(Boolean));
          const missing = required.filter(name => !names.has(name));
          if (missing.length) throw new Error(`${workerName} is missing required Worker Secrets: ${missing.join(', ')}`);
          NODE

      - name: Verify temporary staging hostname
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 https://homemew-web-staging.aisr.online/health || true)"
            case "$code" in
              200|302|303|401|403)
                echo "HomeMew Phase 4 staging is reachable (HTTP $code)"
                exit 0
                ;;
            esac
            echo "Waiting for HomeMew Phase 4 staging hostname ($attempt/20): HTTP $code"
            sleep 3
          done
          echo "HomeMew Phase 4 staging hostname did not become reachable" >&2
          exit 1

      - name: Summarize
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## HomeMew Web Phase 4 staging"
            echo
            echo "- Candidate SHA: ${{ inputs.candidate_sha }}"
            echo "- Worker: homemew-web-staging"
            echo "- Hostname: https://homemew-web-staging.aisr.online"
            echo "- LifeSpace: auth-staging.aisr.online / core-staging.aisr.online"
            echo "- Event contract: temporal_range"
            echo "- Production traffic/configuration: untouched"
            echo "- Temporary review-window launcher: remove after Phase 4 validation"
          } >> "$GITHUB_STEP_SUMMARY"
