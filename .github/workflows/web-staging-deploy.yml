name: Deploy HomeMew Web staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-staging-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: homemew-web-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy HomeMew Web staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report deployment started
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "starting" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          node --input-type=module <<'NODE'
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: 'pending',
              target_url: runUrl,
              description: 'HomeMew Web staging deployment started',
              context: 'homemew-web-staging/deploy',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish pending commit status: ${response.status}`);
          NODE

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          echo "install" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          corepack pnpm install --frozen-lockfile

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          echo "validate-authority" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Validate HomeMew Web
        run: |
          echo "validate-web" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          corepack pnpm test:web
          corepack pnpm typecheck:web

      - name: Deploy HomeMew Web staging
        run: |
          echo "deploy" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          corepack pnpm deploy:web:staging

      - name: Inspect staging runtime readiness
        run: |
          echo "inspect-runtime" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const workerName = 'homemew-web-staging';
          const required = [
            'LIFESPACE_APPLICATION_CREDENTIAL',
            'WEB_SESSION_SECRET',
            'LIFESPACE_INTEGRATIONS_APPLICATION_CREDENTIAL',
          ];
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`,
            {
              headers: {
                authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                accept: 'application/json',
              },
            },
          );
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
            throw new Error(`Could not inspect ${workerName} Worker secret bindings after deployment (HTTP ${response.status})`);
          }

          const names = new Set(payload.result.map((entry) => entry?.name).filter(Boolean));
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) {
            throw new Error(`${workerName} is missing required Worker Secrets after deployment: ${missing.join(', ')}`);
          }

          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/homemew-web-runtime-readiness.json`,
            JSON.stringify({ baseReady: true, integrationsReady: true }),
          );
          console.log('Base runtime secrets: ready');
          console.log('W4 integrations runtime: ready (required)');
          NODE

      - name: Verify staging hostname is reachable
        shell: bash
        run: |
          echo "verify-domain" > "$RUNNER_TEMP/homemew-web-deploy-stage"
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 https://homemew-web-staging.aisr.online/health)"; then
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "homemew-web-staging.aisr.online is reachable (HTTP $code; Cloudflare Access may redirect/deny unauthenticated CI)"
                exit 0
              fi
            fi
            echo "Waiting for HomeMew Web staging hostname (${attempt}/20)"
            sleep 3
          done
          echo "HomeMew Web staging hostname did not become reachable" >&2
          exit 1

      - name: Report deployment result
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const stagePath = `${process.env.RUNNER_TEMP}/homemew-web-deploy-stage`;
          const stage = fs.existsSync(stagePath) ? fs.readFileSync(stagePath, 'utf8').trim() : 'unknown';
          const succeeded = process.env.JOB_STATUS === 'success';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: succeeded ? 'success' : 'failure',
              target_url: runUrl,
              description: succeeded ? 'HomeMew Web staging deployment succeeded' : `HomeMew Web staging failed at ${stage}`,
              context: 'homemew-web-staging/deploy',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish final commit status: ${response.status}`);
          NODE

      - name: Summarize staging deployment
        if: ${{ success() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readinessPath = `${process.env.RUNNER_TEMP}/homemew-web-runtime-readiness.json`;
          const readiness = JSON.parse(fs.readFileSync(readinessPath, 'utf8'));
          if (!readiness.baseReady || !readiness.integrationsReady) throw new Error('Runtime readiness summary is inconsistent');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## HomeMew Web staging\n\n- Worker: \`homemew-web-staging\`\n- Hostname: \`homemew-web-staging.aisr.online\`\n- Build/deploy environment: \`CLOUDFLARE_ENV=staging\`\n- Base runtime secrets: ready\n- W4 integrations runtime: ready — required staging credential binding is present\n- LifeSpace bootstrap authority is not present in this repository/workflow.\n- Production routes/configuration: untouched.\n`);
          NODE
