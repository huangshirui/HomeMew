name: Deploy HomeMew Web Preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_HOMEMEW_WEB_PREVIEW to confirm trusted branch code
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homemew-web-preview-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Preview staging of HomeMew Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout selected trusted revision
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Validate manual Preview gate and bindings
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY_HOMEMEW_WEB_PREVIEW" || { echo "Preview confirmation mismatch" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing Cloudflare credential" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing Cloudflare account" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertPreviewServiceBindings } from './apps/web/preview-service-bindings.mjs';
          const config = JSON.parse(fs.readFileSync('apps/web/wrangler.production.jsonc', 'utf8'));
          if (config.name !== 'homemew-web' || config.preview_urls !== true) throw new Error('Expected same-worker Preview with preview_urls enabled');
          if (config.workers_dev !== false) throw new Error('Production workers_dev must remain disabled');
          if (config.vars?.ENVIRONMENT !== 'production') throw new Error('Production Worker must stay on LifeSpace production');
          if (config.previews?.vars?.ENVIRONMENT !== 'staging') throw new Error('Preview must be staging only');
          assertPreviewServiceBindings(config.previews.services);
          for (const name of ['PLACE_SEARCH_USER_LIMIT', 'PLACE_SEARCH_BURST_LIMIT']) {
            const preview = config.previews?.ratelimits?.find(binding => binding.name === name);
            const production = config.ratelimits?.find(binding => binding.name === name);
            if (!preview || !production || preview.namespace_id === production.namespace_id) {
              throw new Error('Preview must have an isolated rate limit binding: ' + name);
            }
          }
          if (config.previews.vars.LIFESPACE_IDENTITY_URL !== 'https://auth-staging.aisr.online') throw new Error('Preview Identity must be staging');
          if (config.previews.vars.LIFESPACE_CORE_URL !== 'https://core-staging.aisr.online') throw new Error('Preview Core must be staging');
          if (config.previews.vars.STAGING_LIFESPACE_IDENTITY_URL || config.previews.vars.STAGING_LIFESPACE_CORE_URL) throw new Error('Preview must not support dual-environment routing');
          if (config.assets.run_worker_first.indexOf('/_stage/*') === -1) throw new Error('Legacy staging paths must be handled and rejected');
          NODE

      - name: Test, typecheck and build Web
        run: |
          corepack pnpm test:web
          corepack pnpm typecheck:web
          corepack pnpm build:web

      - name: Verify renamed Cloudflare Worker identity (prevent duplicate creation)
        run: node apps/web/verify-cloudflare-worker.mjs

      - name: Deploy named Preview under same Worker
        run: >-
          corepack pnpm dlx wrangler@4.135.0 preview
          --name staging
          --config "$GITHUB_WORKSPACE/apps/web/wrangler.production.jsonc"

      - name: Summarize Preview deployment
        if: ${{ success() }}
        run: |
          {
            echo "## HomeMew Web Preview"
            echo
            echo "- Worker project: homemew-web"
            echo "- Preview name: staging"
            echo "- LifeSpace: staging only, independent of URL query"
            echo "- Browser Preview host requires separate Cloudflare Access protection and a staging LifeSpace Access audience"
            echo "- Mini Program develop/trial/release always use homemew.aisr.online production"
            echo "- Secrets are Preview-scoped and must not be exposed in source or build logs"
          } >> "$GITHUB_STEP_SUMMARY"
