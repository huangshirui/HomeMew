name: Close HomeMew Web W6 acceptance status

on:
  push:
    branches:
      - docs/close-w6-acceptance
    paths:
      - .github/workflows/close-w6-acceptance.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/close-w6-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Close accepted W6 browser gate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/web-plan.md';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(oldText, newText) {
            const first = source.indexOf(oldText);
            if (first < 0) throw new Error('expected W6 status text not found');
            if (source.indexOf(oldText, first + oldText.length) >= 0) throw new Error('W6 status text matched more than once');
            source = source.replace(oldText, newText);
          }

          replaceOnce(
            '### W6 — staging acceptance and product convergence — current',
            '### W6 — staging acceptance and product convergence — acceptance complete, polish ongoing',
          );

          replaceOnce(
            '- production front-door cutover completed on 2026-08-24: `homemew.aisr.online` is owned by `homemew-web-production`, with Cloudflare Access on Web traffic and exact Mini Program login pass-through via `HOMEMEW_BACKEND`.',
            '- production front-door cutover completed on 2026-08-24: `homemew.aisr.online` is owned by `homemew-web-production`, with Cloudflare Access on Web traffic and exact Mini Program login pass-through via `HOMEMEW_BACKEND`.\n- real Cloudflare Access household CRUD/action acceptance completed on 2026-08-25 across Calendar / Tasks / Days / Wishes / Home, including the cross-client, optimistic-concurrency, viewer deny-path and multi-member checks defined in `docs/web-staging-acceptance.md`.',
          );

          replaceOnce(
            '- run/finish real household CRUD/action acceptance through Cloudflare Access across Calendar/Tasks/Days/Wishes/Home;\n',
            '',
          );

          replaceOnce(
            '- only after household browser acceptance, add the richer Calendar renderer if it improves the product without changing LifeSpace semantics;',
            '- consider a richer Calendar renderer only if it materially improves the product without changing LifeSpace semantics;',
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Commit W6 closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/web-plan.md
          git diff --cached --check
          git commit -m "docs(web): close W6 browser acceptance gate"
          git push origin HEAD:docs/close-w6-acceptance
