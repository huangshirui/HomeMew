openapi: 3.1.0
info:
  title: HomeMew Core API
  version: 0.1.0
  description: |
    Authoritative contract for HomeMew Core. Endpoints marked
    `x-homemew-status: implemented` exist in the current Core. Endpoints marked
    `x-homemew-status: planned` are approved contracts but must not be called by
    clients until implemented and deployed.
    Every `date-time` value returned by Core is canonical RFC 3339 UTC with a
    `Z` suffix. Date-only values are never converted to timestamps.
servers:
  - url: https://homemew.aisr.online
    description: Production placeholder; verify the deployed Worker route before use
  - url: http://localhost:8787
    description: Local Wrangler development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Users
  - name: Families
  - name: Members
  - name: Invitations
  - name: Events
  - name: Tasks
  - name: Day Records
  - name: Integrations
  - name: OAuth
  - name: Internal
paths:
  /oauth/token:
    post:
      tags: [OAuth]
      summary: Exchange system client credentials for a short-lived access token
      operationId: exchangeClientCredentials
      security: []
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: OAuth access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthError'
  /health:
    get:
      tags: [System]
      summary: Deployment health probe
      operationId: getHealth
      security: []
      x-homemew-status: implemented
      responses:
        '200':
          description: Worker is running
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/status:
    get:
      tags: [System]
      summary: Core and D1 status
      operationId: getStatus
      security: []
      x-homemew-status: implemented
      responses:
        '200':
          description: Core and database are available
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/me:
    get:
      tags: [Users]
      summary: Get current user
      operationId: getCurrentUser
      x-homemew-status: implemented
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateCurrentUser
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/avatar:
    put:
      tags: [Users]
      summary: Upload and replace the current user's avatar
      operationId: uploadCurrentUserAvatar
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image, at most 5 MB.
      responses:
        '200':
          description: Avatar stored in R2 and assigned to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Avatar exceeds the 5 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported avatar media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/families:
    get:
      tags: [Users, Families]
      summary: List current user's active families
      operationId: listMyFamilies
      x-homemew-status: implemented
      responses:
        '200':
          description: Active family memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFamilyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/families:
    post:
      tags: [Families]
      summary: Create a family
      operationId: createFamily
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyRequest'
      responses:
        '201':
          description: Family created; creator is administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFamilyResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Families]
      summary: Get family details
      operationId: getFamily
      x-homemew-status: implemented
      responses:
        '200':
          description: Family details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Families]
      summary: Update family profile
      operationId: updateFamily
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFamilyRequest'
      responses:
        '200':
          description: Updated family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilySummaryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/families/{familyId}/avatar:
    put:
      tags: [Families]
      summary: Upload and replace the family's avatar
      operationId: uploadFamilyAvatar
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP image, at most 5 MB.
      responses:
        '200':
          description: Avatar stored in R2 and assigned to the family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Avatar exceeds the 5 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported avatar media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/families/{familyId}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Members]
      summary: List active family members
      operationId: listFamilyMembers
      x-homemew-status: implemented
      responses:
        '200':
          description: Family members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/families/{familyId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      summary: Change a member role
      operationId: updateFamilyMemberRole
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberRoleResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Members]
      summary: Remove a family member
      operationId: removeFamilyMember
      x-homemew-status: implemented
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/leave:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags: [Members]
      summary: Leave a family
      operationId: leaveFamily
      x-homemew-status: implemented
      responses:
        '204':
          description: Current user left the family
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/invites:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Invitations]
      summary: List family invitations
      operationId: listFamilyInvites
      x-homemew-status: implemented
      responses:
        '200':
          description: Invitation list without plaintext codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Invitations]
      summary: Create a family invitation
      operationId: createFamilyInvite
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invitation created; plaintext code is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInviteResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/families/{familyId}/invites/{inviteId}/revoke:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/InviteId'
    post:
      tags: [Invitations]
      summary: Revoke an invitation
      operationId: revokeFamilyInvite
      x-homemew-status: implemented
      responses:
        '204':
          description: Invitation revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/family-invites/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    get:
      tags: [Invitations]
      summary: Preview an invitation
      operationId: previewFamilyInvite
      x-homemew-status: implemented
      responses:
        '200':
          description: Limited family invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/family-invites/{code}/join:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    post:
      tags: [Invitations]
      summary: Join a family using an invitation
      operationId: joinFamilyByInvite
      x-homemew-status: implemented
      responses:
        '200':
          description: Membership created or reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinFamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/integrations:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Integrations]
      summary: List external systems
      operationId: listIntegrations
      x-homemew-status: implemented
      responses:
        '200':
          description: External systems
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Integrations]
      summary: Create an external system
      operationId: createIntegration
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationRequest' }
      responses:
        '201':
          description: External system created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/integrations/{integrationId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/IntegrationId'
    get:
      tags: [Integrations]
      operationId: getIntegration
      summary: Get an external system
      x-homemew-status: implemented
      responses:
        '200':
          description: External system
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Integrations]
      operationId: updateIntegration
      summary: Update an external system
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntegrationRequest' }
      responses:
        '200':
          description: Updated external system
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Integrations]
      operationId: deleteIntegration
      summary: Soft-delete an external system and revoke its credentials
      x-homemew-status: implemented
      responses:
        '204': { description: External system deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/integrations/{integrationId}/client-secrets:
    post:
      tags: [Integrations]
      operationId: createIntegrationClientSecret
      summary: Create a one-time OAuth client secret
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Client secret shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSecretResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/integrations/{integrationId}/api-tokens:
    post:
      tags: [Integrations]
      operationId: createIntegrationApiToken
      summary: Create a one-time long-lived API token
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: API token shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/integrations/{integrationId}/credentials:
    get:
      tags: [Integrations]
      operationId: listIntegrationCredentials
      summary: List redacted integration credentials
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Redacted credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/integrations/{integrationId}/credentials/{credentialId}:
    delete:
      tags: [Integrations]
      operationId: revokeIntegrationCredential
      summary: Revoke one credential immediately
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IntegrationId'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '204': { description: Credential revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/families/{familyId}/events:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Events]
      summary: List family events overlapping a time range
      operationId: listFamilyEvents
      x-homemew-status: implemented
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Inclusive calendar date at the start of the viewing window.
        - name: endDateExclusive
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Exclusive calendar date at the end of the viewing window.
        - name: timezone
          in: query
          schema:
            type: string
          description: IANA timezone used to convert the calendar window to UTC for timed events. Defaults to the family timezone.
        - name: attendeeId
          in: query
          schema:
            type: string
          description: HomeMew user ID or `me`.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Events]
      summary: Create an event
      operationId: createEvent
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/families/{familyId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get an event
      operationId: getEvent
      x-homemew-status: implemented
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events]
      summary: Update an event
      operationId: updateEvent
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Events]
      summary: Soft-delete an event
      operationId: deleteEvent
      x-homemew-status: implemented
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/tasks:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Tasks]
      summary: List family tasks
      operationId: listFamilyTasks
      x-homemew-status: implemented
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated task statuses. Defaults to pending.
        - name: assigneeId
          in: query
          schema:
            type: string
          description: HomeMew user ID or `me`.
        - name: dueDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueDateTo
          in: query
          schema:
            type: string
            format: date
        - name: includeNoDue
          in: query
          schema:
            type: boolean
            default: true
        - name: sort
          in: query
          schema:
            type: string
            enum: [due_asc, due_desc, created_desc, updated_desc]
            default: due_asc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
