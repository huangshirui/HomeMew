  /api/v1/internal/users:
    post:
      tags: [Internal]
      summary: Create a HomeMew internal user
      operationId: createInternalUser
      description: Requires a token whose space-delimited scope contains `internal`.
      x-homemew-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Current implementation accepts HS256 JWT. Normal token `sub` is a
        HomeMew internal user ID and must carry `type: user` with
        `aud: homemew-core`. Internal endpoints additionally require a service
        token with `type: service`, `aud: homemew-core-internal`, and a
        space-delimited `scope` containing `internal`. The issuer (`iss`) must
        be `homemew-identity` and the token lifetime must not exceed 3600
        seconds (`exp - iat <= 3600`).
  headers:
    RequestId:
      description: Request correlation ID accepted or generated by Core.
      schema:
        type: string
  parameters:
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        pattern: '^fam_'
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema: { type: string, pattern: '^sys_' }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, pattern: '^crd_' }
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: '^usr_'
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        pattern: '^inv_'
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 8
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        pattern: '^evt_'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tsk_'
    DayRecordId:
      name: dayRecordId
      in: path
      required: true
      schema:
        type: string
        pattern: '^day_'
    Version:
      name: version
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    OAuthError:
      description: OAuth protocol error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required or token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller lacks permission or user is disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business rule or optimistic concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SystemPermission:
      type: string
      enum: [family:read, events:read, events:write, tasks:read, tasks:write, day-records:read, day-records:write]
    ActorRef:
      type: object
      required: [type, id, name, avatarUrl]
      properties:
        type: { type: string, enum: [user, system] }
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
    Integration:
      type: object
      required: [id, name, description, status, permissions, createdBy, createdAt, updatedAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled] }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/SystemPermission' }
        createdBy: { $ref: '#/components/schemas/ActorRef' }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
        updatedAt: { $ref: '#/components/schemas/UtcDateTime' }
        lastUsedAt: { $ref: '#/components/schemas/NullableUtcDateTime' }
    CreateIntegrationRequest:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/SystemPermission' }
    UpdateIntegrationRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        status: { type: string, enum: [active, disabled] }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/SystemPermission' }
    IntegrationResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Integration' } }
    IntegrationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Integration' } }
    Credential:
      type: object
      required: [id, type, suffix, status, expiresAt, lastUsedAt, createdAt, revokedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [oauth_client_secret, api_token] }
        suffix: { type: string }
        status: { type: string, enum: [active, revoked] }
        expiresAt: { $ref: '#/components/schemas/NullableUtcDateTime' }
        lastUsedAt: { $ref: '#/components/schemas/NullableUtcDateTime' }
        createdAt: { $ref: '#/components/schemas/UtcDateTime' }
        revokedAt: { $ref: '#/components/schemas/NullableUtcDateTime' }
    CredentialListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Credential' } }
    ClientSecretResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: '#/components/schemas/Credential' }
            - type: object
              required: [clientId, clientSecret]
              properties: { clientId: { type: string }, clientSecret: { type: string, writeOnly: true } }
    ApiTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: '#/components/schemas/Credential' }
            - type: object
              required: [token]
              properties: { token: { type: string, writeOnly: true } }
    OAuthTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }
        scope: { type: string }
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, writeOnly: true }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 3600 }
        scope: { type: string }
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_scope, unsupported_grant_type, temporarily_unavailable] }
        error_description: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [FORBIDDEN]
            message:
              type: string
            requestId:
              type: string
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              const: ok
    StatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database, schemaVersion]
          properties:
            status:
              const: ok
            database:
              const: available
            schemaVersion:
              type: string
    UserStatus:
      type: string
      enum: [active, disabled]
    FamilyRole:
      type: string
      enum: [admin, member]
    FamilyStatus:
      type: string
      enum: [active, archived]
    UserProfile:
      type: object
      required: [id, displayName, avatarUrl, status]
      properties:
        id:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        status:
          $ref: '#/components/schemas/UserStatus'
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'
    UpdateCurrentUserRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
    AvatarUploadResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [avatarUrl]
          properties:
            avatarUrl:
              type: string
              format: uri
              description: Public HTTPS URL derived by Core from ASSETS_PUBLIC_URL and the stored avatar key.
    FamilyListItem:
      type: object
      required: [id, name, avatarUrl, timezone, role, memberCount]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        timezone:
          type: string
          description: IANA timezone used to interpret household calendar dates.
        role:
          $ref: '#/components/schemas/FamilyRole'
        memberCount:
          type: integer
          minimum: 1
          maximum: 8
    MyFamilyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FamilyListItem'
    CreateFamilyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          default: Asia/Shanghai
    UpdateFamilyRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
    CreateFamilyResult:
      allOf:
        - $ref: '#/components/schemas/FamilyListItem'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              $ref: '#/components/schemas/UtcDateTime'
    CreateFamilyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CreateFamilyResult'
    FamilyDetail:
      type: object
      required: [id, name, avatarUrl, timezone, status, createdBy, currentUserRole, memberCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        timezone:
          type: string
        status:
          $ref: '#/components/schemas/FamilyStatus'
        createdBy:
          type: string
        currentUserRole:
          oneOf:
            - $ref: '#/components/schemas/FamilyRole'
            - type: 'null'
        memberCount:
          type: integer
        createdAt:
          $ref: '#/components/schemas/UtcDateTime'
    FamilyDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FamilyDetail'
    FamilySummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, name, avatarUrl, timezone, status]
          properties:
            id:
              type: string
            name:
              type: string
            avatarUrl:
