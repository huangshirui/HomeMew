      required: [data]
      properties:
        data:
          type: object
          required: [avatarUrl]
          properties:
            avatarUrl:
              type: string
              format: uri
              description: Public HTTPS URL derived by Core from ASSETS_PUBLIC_URL and the stored avatar key.
    FamilyListItem:
      type: object
      required: [id, name, avatarUrl, timezone, role, memberCount]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        timezone:
          type: string
          description: IANA timezone used to interpret household calendar dates.
        role:
          $ref: '#/components/schemas/FamilyRole'
        memberCount:
          type: integer
          minimum: 1
          maximum: 8
    MyFamilyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FamilyListItem'
    CreateFamilyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          default: Asia/Shanghai
    UpdateFamilyRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
    CreateFamilyResult:
      allOf:
        - $ref: '#/components/schemas/FamilyListItem'
        - type: object
          required: [createdAt]
          properties:
