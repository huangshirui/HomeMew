          type: [string, 'null']
        status:
          $ref: '#/components/schemas/EventStatus'
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        createdBy:
          $ref: '#/components/schemas/PersonRef'
        updatedBy:
          $ref: '#/components/schemas/PersonRef'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateEventRequest:
